name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  gui-release:
    name: GUI Release (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install GUI deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build GUI release binary
        working-directory: gui/src-tauri
        run: cargo build --release -vv

  platform-test:
    name: GUI Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15-intel
          - macos-15
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Windows'

      - uses: dtolnay/rust-toolchain@1.94.0
        if: runner.os == 'Windows'

      - name: Force Rust override (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup override set 1.94.0
          rustup show active-toolchain

      - name: Install GUI deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - uses: Swatinem/rust-cache@v2

      - name: Diagnose GUI build inputs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "== Toolchain =="
          rustc -Vv
          cargo -V
          rustup show active-toolchain
          Write-Host "== Paths =="
          Write-Host "PWD: $(Get-Location)"
          Write-Host "GITHUB_WORKSPACE: $env:GITHUB_WORKSPACE"
          Write-Host "== Tauri config files =="
          Get-ChildItem -Force gui/src-tauri
          if (!(Test-Path "gui/src-tauri/tauri.conf.json")) { throw "missing gui/src-tauri/tauri.conf.json" }
          Get-Content -Raw "gui/src-tauri/tauri.conf.json"
          if (Test-Path "gui/src-tauri/capabilities") {
            Write-Host "== Capabilities directory =="
            Get-ChildItem -Force "gui/src-tauri/capabilities"
            $defaultCapability = "gui/src-tauri/capabilities/default.json"
            if (Test-Path $defaultCapability) {
              Get-Content -Raw $defaultCapability
            }
          } else {
            Write-Host "No capabilities directory present."
          }
          Write-Host "== Dependency resolution =="
          cargo tree --manifest-path gui/src-tauri/Cargo.toml -p codex-shim-gui | Select-String "tauri v|tauri-build v|tauri-macros v|tauri-codegen v"

      - name: Build GUI release binary
        working-directory: gui/src-tauri
        run: cargo build --release -vv
